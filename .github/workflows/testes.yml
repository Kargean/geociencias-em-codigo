name: Testes

# Quando rodar: a cada push na main, em todo pull request e quando você pedir (botão "Run workflow").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permissão mínima: este fluxo só precisa LER o código.
permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Entre aspas! Sem aspas, 3.10 seria lido como o número 3.1.
        python: ["3.11", "3.12", "3.13"]
        include:
          # Um teste que só roda no Linux não avisa de problemas do Windows (arquivo aberto não pode ser apagado,
          # por exemplo). Uma combinação a mais custa poucos segundos e pega essa classe de erro.
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: projeto_chuva
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Mostrar versões
        run: |
          python --version
          python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"

      - name: Rodar os testes
        run: python -m unittest discover -s tests -v
